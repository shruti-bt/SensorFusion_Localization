<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 710" width="1000" height="710" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4b5563"/>
    </marker>
  </defs>
  <rect width="1000" height="710" fill="#ffffff"/>

  <text x="500" y="30" text-anchor="middle" font-size="20" font-weight="700" fill="#111827">Localization of the ROV in the ship frame</text>

  <!-- column headers -->
  <text x="145" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">SENSORS</text>
  <text x="855" y="72" text-anchor="middle" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">OUTPUT</text>

  <!-- factor graph box -->
  <rect x="330" y="50" width="330" height="520" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <text x="495" y="72" text-anchor="middle" font-size="13" font-weight="700" fill="#374151">Factor graph, one batch solve</text>

  <!-- sensors -->
  <g stroke="#6b7280" stroke-width="1.5" fill="#ffffff">
    <rect x="30" y="90" width="230" height="56" rx="8"/>
    <rect x="30" y="160" width="230" height="56" rx="8"/>
    <rect x="30" y="230" width="230" height="56" rx="8"/>
    <rect x="30" y="300" width="230" height="56" rx="8"/>
  </g>
  <rect x="30" y="370" width="230" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <g font-size="14" font-weight="700" fill="#111827">
    <text x="145" y="114" text-anchor="middle">ZED Mini VIO</text>
    <text x="145" y="184" text-anchor="middle">DVL</text>
    <text x="145" y="254" text-anchor="middle">ROV IMU</text>
    <text x="145" y="324" text-anchor="middle">Pressure sensor</text>
    <text x="145" y="394" text-anchor="middle" fill="#075985">Underwater GPS</text>
  </g>
  <g font-size="11.5" fill="#4b5563">
    <text x="145" y="132" text-anchor="middle">camera poses + tracking quality</text>
    <text x="145" y="202" text-anchor="middle">velocity vx, vy, vz in body frame</text>
    <text x="145" y="272" text-anchor="middle">roll, pitch</text>
    <text x="145" y="342" text-anchor="middle">depth below the surface</text>
    <text x="145" y="412" text-anchor="middle" fill="#075985">locator x, y, z in receiver frame</text>
  </g>

  <!-- factors -->
  <g stroke="#6b7280" stroke-width="1.2" fill="#ffffff">
    <rect x="345" y="90" width="300" height="56" rx="8"/>
    <rect x="345" y="160" width="300" height="56" rx="8"/>
    <rect x="345" y="230" width="300" height="56" rx="8"/>
    <rect x="345" y="300" width="300" height="56" rx="8"/>
  </g>
  <rect x="345" y="370" width="300" height="56" rx="8" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <g font-size="13" font-weight="700" fill="#111827">
    <text x="495" y="114" text-anchor="middle">Relative pose between images</text>
    <text x="495" y="184" text-anchor="middle">Displacement = velocity × time</text>
    <text x="495" y="254" text-anchor="middle">Gravity direction</text>
    <text x="495" y="324" text-anchor="middle">Depth along gravity</text>
    <text x="495" y="394" text-anchor="middle" fill="#075985">Absolute position, robust loss</text>
  </g>
  <g font-size="11.5" fill="#4b5563">
    <text x="495" y="132" text-anchor="middle">smooth motion, trusted less when tracking is poor</text>
    <text x="495" y="202" text-anchor="middle">gives metric scale, works where vision fails</text>
    <text x="495" y="272" text-anchor="middle">fixes the camera tilt</text>
    <text x="495" y="342" text-anchor="middle">bounds vertical drift</text>
    <text x="495" y="412" text-anchor="middle" fill="#075985">removes drift, tolerates multipath outliers</text>
  </g>

  <!-- planned: map-based fix (dashed) -->
  <rect x="30" y="440" width="230" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="145" y="464" text-anchor="middle" font-size="14" font-weight="700" fill="#111827">ZED images + depth</text>
  <text x="145" y="482" text-anchor="middle" font-size="11.5" fill="#4b5563">compared with the COLMAP hull map</text>
  <rect x="345" y="440" width="300" height="56" rx="8" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="495" y="464" text-anchor="middle" font-size="13" font-weight="700" fill="#111827">Map-based fix + depth-to-hull</text>
  <text x="495" y="482" text-anchor="middle" font-size="11.5" fill="#4b5563">absolute pose on mapped hull, standoff and tilt</text>
  <line x1="262" y1="468" x2="343" y2="468" stroke="#4b5563" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ah)"/>

  <!-- unknowns -->
  <g transform="translate(0,70)">
  <text x="495" y="454" text-anchor="middle" font-size="12" font-weight="700" fill="#374151">Unknowns solved together</text>
  <text x="495" y="472" text-anchor="middle" font-size="11.5" fill="#4b5563">pose per image, depth offset, alignment (ψ, t_a)</text>
  <text x="495" y="489" text-anchor="middle" font-size="11.5" fill="#4b5563">no compass: heading from VIO, DVL direction, motion</text>

  </g>
  <!-- arrows sensors -> factors -->
  <g stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah)" fill="none">
    <line x1="262" y1="118" x2="343" y2="118"/>
    <line x1="262" y1="188" x2="343" y2="188"/>
    <line x1="262" y1="258" x2="343" y2="258"/>
    <line x1="262" y1="328" x2="343" y2="328"/>
  </g>
  <line x1="262" y1="398" x2="343" y2="398" stroke="#0369a1" stroke-width="2.2" marker-end="url(#ah)"/>

  <!-- outputs -->
  <g stroke="#15803d" stroke-width="1.5" fill="#dcfce7">
    <rect x="740" y="116" width="230" height="72" rx="8"/>
    <rect x="740" y="215" width="230" height="64" rx="8"/>
    <rect x="740" y="310" width="230" height="64" rx="8"/>
  </g>
  <g font-size="14" font-weight="700" fill="#14532d">
    <text x="855" y="140" text-anchor="middle">ROV pose in the ship frame</text>
    <text x="855" y="241" text-anchor="middle">Uncertainty</text>
    <text x="855" y="336" text-anchor="middle">Map-to-ship transform</text>
  </g>
  <g font-size="11.5" fill="#374151">
    <text x="855" y="159" text-anchor="middle">x, y, z, roll, pitch, yaw</text>
    <text x="855" y="260" text-anchor="middle">1-sigma position, incl. alignment</text>
    <text x="855" y="355" text-anchor="middle">localization_info.json</text>
  </g>
  <text x="855" y="177" text-anchor="middle" font-size="10.5" fill="#6b7280">rov_ship.csv, poses_ship.txt</text>
  <g stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah)" fill="none">
    <line x1="662" y1="152" x2="738" y2="152"/>
    <line x1="662" y1="247" x2="738" y2="247"/>
    <line x1="662" y1="342" x2="738" y2="342"/>
  </g>

  <!-- legend -->
  <rect x="740" y="450" width="40" height="22" rx="5" fill="#ffffff" stroke="#6b7280" stroke-width="1.5" stroke-dasharray="6 4"/>
  <text x="790" y="466" font-size="11.5" fill="#4b5563">planned, not built yet</text>
  <rect x="740" y="480" width="40" height="22" rx="5" fill="#e0f2fe" stroke="#0369a1" stroke-width="2"/>
  <text x="790" y="496" font-size="11.5" fill="#4b5563">added to the mapping sensors</text>

  <!-- frames -->
  <g transform="translate(0,70)">
  <text x="30" y="525" font-size="12" font-weight="700" fill="#6b7280" letter-spacing="1">FRAMES</text>
  <g stroke="#6b7280" stroke-width="1.5" fill="#ffffff">
    <rect x="30" y="535" width="230" height="64" rx="8"/>
    <rect x="385" y="535" width="230" height="64" rx="8"/>
  </g>
  <rect x="740" y="535" width="230" height="64" rx="8" fill="#dcfce7" stroke="#15803d" stroke-width="2"/>
  <g font-size="14" font-weight="700" fill="#111827">
    <text x="145" y="561" text-anchor="middle">VIO map frame</text>
    <text x="500" y="561" text-anchor="middle">Receiver frame</text>
    <text x="855" y="561" text-anchor="middle" fill="#14532d">Ship frame</text>
  </g>
  <g font-size="11.5" fill="#4b5563">
    <text x="145" y="580" text-anchor="middle">origin = first image, down = gravity</text>
    <text x="500" y="580" text-anchor="middle">where the UGPS reports x, y, z</text>
    <text x="855" y="580" text-anchor="middle">what we want to know</text>
  </g>
  <g stroke="#4b5563" stroke-width="1.6" marker-end="url(#ah)" fill="none">
    <line x1="262" y1="577" x2="383" y2="577"/>
    <line x1="617" y1="577" x2="738" y2="577"/>
  </g>
  <g font-size="11" text-anchor="middle" fill="#374151">
    <text x="322" y="553" font-weight="700">alignment</text>
    <text x="322" y="567">estimated by the solver</text>
    <text x="322" y="595" fill="#6b7280">yaw ψ, translation t_a</text>
    <text x="678" y="553" font-weight="700">receiver mounting</text>
    <text x="678" y="567">you set it</text>
    <text x="678" y="595" fill="#6b7280">R_ship_rx, t_ship_rx</text>
  </g>
  </g>
</svg>
